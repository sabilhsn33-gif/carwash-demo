<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Dashboard Keuangan Carwash — Mode Demo</title>
  <style>
    /* ==========================================================================
       1. TOKEN TEMA & MOTION SYSTEM (INSPIRASI APPLE DESIGN SYSTEM)
       ========================================================================== */
    :root {
      /* Durasi & Kurva Animasi (Hanya Transform & Opacity) */
      --dur-fast: 120ms;
      --dur-base: 250ms;
      --dur-slow: 450ms;
      --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
      --ease-sheet: cubic-bezier(0.32, 0.72, 0, 1);

      /* Tipografi */
      --font-system: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;

      /* Palet Mode Terang (Kontras Teks >= 4.5:1) */
      --bg-page: #F5F5F7;
      --bg-card: #FFFFFF;
      --bg-card-subtle: #F2F2F7;
      --bg-card-translucent: rgba(255, 255, 255, 0.82);
      --text-main: #1D1D1F;
      --text-sec: #6E6E73;
      --text-tertiary: #86868B;
      --accent: #0066CC;
      --accent-hover: #0055B3;
      --accent-soft: rgba(0, 102, 204, 0.08);
      --border-thin: rgba(0, 0, 0, 0.08);
      --border-card: rgba(0, 0, 0, 0.06);

      /* Status Semantik (Hanya untuk selisih & konfirmasi, selalu dengan teks/ikon) */
      --positive: #1A7F37;
      --positive-bg: rgba(26, 127, 55, 0.1);
      --negative: #C5221F;
      --negative-bg: rgba(197, 34, 31, 0.1);
      --warning: #9A6700;
      --warning-bg: rgba(154, 103, 0, 0.1);

      /* Token Kotak Ikon Kartu & Judul (Mode Terang) */
      --icon-in-bg: #E8F5EC;
      --icon-in-fg: #1A7F37;
      --icon-out-bg: #FCE8E7;
      --icon-out-fg: #C5221F;
      --icon-kasbon-bg: #F0F0F2;
      --icon-kasbon-fg: var(--text-sec);
      --icon-diff-bg: #E5F0FF;
      --icon-diff-fg: #0066CC;
      --icon-rekap-bg: #F0F0F2;
      --icon-rekap-fg: var(--text-main);

      /* Shape & Depth */
      --radius-card: 20px;
      --radius-control: 12px;
      --radius-pill: 9999px;
      --shadow-subtle: 0 4px 20px -2px rgba(0, 0, 0, 0.04), 0 2px 6px -1px rgba(0, 0, 0, 0.02);
      --shadow-nav: 0 -4px 24px rgba(0, 0, 0, 0.05);
      --shadow-elevated: 0 12px 32px -4px rgba(0, 0, 0, 0.12);

      --tabbar-height: 64px;
      --header-blur: blur(20px);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg-page: #000000;
        --bg-card: #1C1C1E;
        --bg-card-subtle: #2C2C2E;
        --bg-card-translucent: rgba(28, 28, 30, 0.82);
        --text-main: #F5F5F7;
        --text-sec: #98989D;
        --text-tertiary: #636366;
        --accent: #2997FF;
        --accent-hover: #54A9FF;
        --accent-soft: rgba(41, 151, 255, 0.15);
        --border-thin: rgba(255, 255, 255, 0.12);
        --border-card: rgba(255, 255, 255, 0.08);

        --positive: #30D158;
        --positive-bg: rgba(48, 209, 88, 0.15);
        --negative: #FF453A;
        --negative-bg: rgba(255, 69, 58, 0.15);
        --warning: #FFD60A;
        --warning-bg: rgba(255, 214, 10, 0.15);

        /* Token Kotak Ikon Kartu & Judul (Mode Gelap) */
        --icon-in-bg: rgba(48, 209, 88, 0.15);
        --icon-in-fg: #30D158;
        --icon-out-bg: rgba(255, 69, 58, 0.15);
        --icon-out-fg: #FF453A;
        --icon-kasbon-bg: #2C2C2E;
        --icon-kasbon-fg: var(--text-sec);
        --icon-diff-bg: rgba(41, 151, 255, 0.15);
        --icon-diff-fg: #2997FF;
        --icon-rekap-bg: #2C2C2E;
        --icon-rekap-fg: var(--text-main);

        --shadow-subtle: 0 4px 20px -2px rgba(0, 0, 0, 0.4);
        --shadow-nav: 0 -4px 24px rgba(0, 0, 0, 0.5);
        --shadow-elevated: 0 16px 40px rgba(0, 0, 0, 0.6);
      }
    }

    /* Fallback jika backdrop-filter tidak didukung */
    @supports not ((-webkit-backdrop-filter: blur(20px)) or (backdrop-filter: blur(20px))) {
      :root {
        --bg-card-translucent: var(--bg-card);
      }
    }

    /* Aksesibilitas: Pengurangan Gerak Sesuai Preferensi */
    @media (prefers-reduced-motion: reduce) {
      :root {
        --dur-fast: 0ms;
        --dur-base: 0ms;
        --dur-slow: 0ms;
      }
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
        scroll-behavior: auto !important;
      }
      .anim-count {
        transition: none !important;
      }
    }

    /* ==========================================================================
       2. RESET & BASE
       ========================================================================== */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html {
      font-size: 100%;
      -webkit-text-size-adjust: 100%;
    }

    body {
      font-family: var(--font-system);
      font-size: 1rem;
      line-height: 1.48;
      color: var(--text-main);
      background-color: var(--bg-page);
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    button, input, select, textarea {
      font-family: inherit;
      font-size: 1rem; /* Mencegah auto-zoom Safari di layar HP */
      color: inherit;
      border: none;
      background: none;
    }

    button {
      cursor: pointer;
      touch-action: manipulation;
    }

    :focus-visible {
      outline: 2.5px solid var(--accent);
      outline-offset: 3px;
    }

    /* Utilitas Visibilitas Screen Reader */
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    /* SVG Icon Style Helper */
    .icon {
      width: 22px;
      height: 22px;
      stroke-width: 1.75;
      stroke: currentColor;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
      display: inline-block;
      vertical-align: middle;
      flex-shrink: 0;
    }
    .icon-sm { width: 18px; height: 18px; }
    .icon-lg { width: 28px; height: 28px; }

    /* ==========================================================================
       3. STRUKTUR UTAMA & LAYOUT RESPOMSIF
       ========================================================================== */
    .demo-ribbon {
      position: sticky;
      top: 0;
      z-index: 100;
      background: var(--bg-card);
      border-bottom: 1px solid var(--border-thin);
      padding: calc(0.35rem + env(safe-area-inset-top, 0px)) 1rem 0.35rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      font-size: 0.8125rem;
      font-weight: 500;
      color: var(--text-sec);
    }

    .demo-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      background: var(--accent-soft);
      color: var(--accent);
      padding: 0.15rem 0.55rem;
      border-radius: var(--radius-pill);
      font-weight: 600;
      font-size: 0.75rem;
      letter-spacing: 0.02em;
    }

    .app-viewport {
      display: flex;
      flex: 1;
      width: 100%;
      max-width: 1400px;
      margin: 0 auto;
      position: relative;
    }

    .content-area {
      flex: 1;
      width: 100%;
      max-width: 1160px;
      margin: 0 auto;
      padding: 1rem 1rem calc(var(--tabbar-height) + 2rem + env(safe-area-inset-bottom, 0px));
      transition: opacity var(--dur-base) var(--ease-out), transform var(--dur-base) var(--ease-out);
    }

    /* ==========================================================================
       4. NAVIGASI: TAB BAR BAWAH (HP) & SIDEBAR KIRI (DESKTOP >= 1024px)
       ========================================================================== */
    .main-navigation {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 90;
      background: var(--bg-card-translucent);
      -webkit-backdrop-filter: var(--header-blur);
      backdrop-filter: var(--header-blur);
      border-top: 1px solid var(--border-thin);
      box-shadow: var(--shadow-nav);
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }

    .nav-track {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      list-style: none;
      position: relative;
      margin: 0 auto;
      max-width: 540px;
    }

    .nav-item {
      display: flex;
      justify-content: center;
      position: relative;
    }

    .nav-tab-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      min-height: 56px;
      min-width: 44px;
      padding: 0.35rem 0.2rem;
      color: var(--text-sec);
      font-size: 0.75rem;
      font-weight: 500;
      gap: 0.2rem;
      transition: color var(--dur-fast) var(--ease-out), transform var(--dur-fast) var(--ease-out);
      position: relative;
      z-index: 2;
    }

    .nav-tab-btn:active {
      transform: scale(0.94);
    }

    .nav-tab-btn[aria-current="page"] {
      color: var(--accent);
      font-weight: 600;
    }

    /* Penonjolan Khusus Tombol "Catat" di Mobile */
    .nav-tab-btn.catat-highlight .icon-wrap {
      background: var(--accent);
      color: #FFFFFF;
      width: 38px;
      height: 38px;
      border-radius: var(--radius-pill);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 12px rgba(0, 102, 204, 0.3);
      transition: transform var(--dur-fast) var(--ease-out), background-color var(--dur-fast);
      margin-top: -8px;
    }

    .nav-tab-btn.catat-highlight:active .icon-wrap {
      transform: scale(0.92);
    }

    .desktop-sidebar-header {
      display: none;
    }

    /* ==========================================================================
       5. KOMPONEN UI UTAMA & CARD SYSTEM
       ========================================================================== */
    .card {
      background: var(--bg-card);
      border-radius: var(--radius-card);
      border: 1px solid var(--border-card);
      box-shadow: var(--shadow-subtle);
      padding: 1.25rem;
      margin-bottom: 1rem;
      position: relative;
      transition: transform var(--dur-fast) var(--ease-out);
    }

    .card:active {
      transform: scale(0.995);
    }

    .card-hero {
      background: linear-gradient(180deg, var(--bg-card) 0%, var(--bg-card-subtle) 100%);
      border: 1px solid var(--border-thin);
      padding: 1.5rem 1.25rem;
    }

    .card-header-flex {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 0.5rem;
      margin-bottom: 0.4rem;
    }

    .card-label {
      font-size: 0.875rem;
      font-weight: 600;
      color: var(--text-sec);
      display: inline-flex;
      align-items: center;
      gap: 0.75rem;
      letter-spacing: -0.01em;
      min-width: 0;
      overflow-wrap: anywhere;
    }

    /* Kotak Ikon 40x40px & 32x32px */
    .icon-box-40 {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .icon-box-in {
      background-color: var(--icon-in-bg);
      color: var(--icon-in-fg);
    }

    .icon-box-out {
      background-color: var(--icon-out-bg);
      color: var(--icon-out-fg);
    }

    .icon-box-kasbon {
      background-color: var(--icon-kasbon-bg);
      color: var(--icon-kasbon-fg);
    }

    .icon-box-diff {
      background-color: var(--icon-diff-bg);
      color: var(--icon-diff-fg);
    }

    .section-title-with-icon {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .icon-circle-32-catat {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background-color: #0066CC;
      color: #FFFFFF;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .icon-box-32-rekap {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      background-color: var(--icon-rekap-bg);
      color: var(--icon-rekap-fg);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    /* Ilustrasi Kosong Maksimal 120px dengan Fade-in 250ms */
    .empty-state-illustration {
      width: 96px;
      max-width: 120px;
      height: 96px;
      margin: 0 auto 0.75rem;
      display: block;
      color: var(--text-sec);
      stroke: currentColor;
      stroke-width: 1.75;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
      animation: emptyFadeIn 250ms var(--ease-out) both;
    }

    @keyframes emptyFadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @media (prefers-reduced-motion: reduce) {
      .empty-state-illustration {
        animation: none !important;
      }
    }

    /* Angka Tabular (Anti Geter saat Animasi Count-Up) */
    .num-hero {
      font-size: clamp(2rem, 7vw, 2.75rem);
      font-weight: 700;
      line-height: 1.15;
      letter-spacing: -0.03em;
      font-variant-numeric: tabular-nums;
      overflow-wrap: anywhere;
      word-break: break-word;
      margin: 0.35rem 0 0.5rem;
    }

    .num-large {
      font-size: clamp(1.4rem, 4.8vw, 1.95rem);
      font-weight: 700;
      line-height: 1.2;
      letter-spacing: -0.02em;
      font-variant-numeric: tabular-nums;
      overflow-wrap: anywhere;
    }

    .num-medium {
      font-size: clamp(1.15rem, 3.4vw, 1.35rem);
      font-weight: 600;
      font-variant-numeric: tabular-nums;
      overflow-wrap: anywhere;
      word-break: break-word;
    }

    .tx-amount {
      font-weight: 400; /* Wajib tidak tebal pada transaksi individual */
      font-variant-numeric: tabular-nums;
    }

    .notice-non-laba {
      margin-top: 0.85rem;
      padding: 0.65rem 0.9rem;
      background: var(--bg-card-subtle);
      border-radius: var(--radius-control);
      font-size: 0.875rem;
      font-weight: 600;
      color: var(--text-sec);
      text-align: center;
      border: 1px solid var(--border-thin);
    }

    .tag-chip {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      padding: 0.25rem 0.65rem;
      border-radius: var(--radius-pill);
      font-size: 0.8125rem;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
      background: var(--bg-card-subtle);
      color: var(--text-main);
    }

    .tag-positive {
      background: var(--positive-bg);
      color: var(--positive);
    }

    .tag-negative {
      background: var(--negative-bg);
      color: var(--negative);
    }

    /* Slider / Selector Bulan Horizontal (Snap Smooth) */
    .month-pills-scroller {
      display: flex;
      gap: 0.5rem;
      overflow-x: auto;
      padding: 0.35rem 0.2rem 0.75rem;
      scroll-snap-type: x mandatory;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
    }
    .month-pills-scroller::-webkit-scrollbar { display: none; }

    .month-pill-btn {
      flex: 0 0 auto;
      scroll-snap-align: center;
      padding: 0.6rem 1.15rem;
      min-height: 44px;
      border-radius: var(--radius-pill);
      background: var(--bg-card);
      border: 1px solid var(--border-card);
      font-size: 0.9375rem;
      font-weight: 600;
      color: var(--text-sec);
      transition: all var(--dur-fast) var(--ease-out);
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.02);
    }

    .month-pill-btn[aria-selected="true"] {
      background: var(--accent);
      color: #FFFFFF;
      border-color: var(--accent);
      box-shadow: 0 4px 14px rgba(0, 102, 204, 0.35);
    }

    .month-pill-btn:active {
      transform: scale(0.96);
    }

    /* Segmented Control dengan Sliding Pill */
    .segmented-control {
      position: relative;
      display: flex;
      background: var(--bg-card-subtle);
      border-radius: var(--radius-control);
      padding: 3px;
      gap: 2px;
      margin-bottom: 1.25rem;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .segmented-control::-webkit-scrollbar { display: none; }

    .segmented-btn {
      flex: 1 1 auto;
      min-height: 40px;
      min-width: 80px;
      padding: 0.45rem 0.75rem;
      border-radius: calc(var(--radius-control) - 3px);
      font-size: 0.875rem;
      font-weight: 600;
      color: var(--text-sec);
      text-align: center;
      white-space: nowrap;
      transition: color var(--dur-fast) var(--ease-out), background-color var(--dur-fast);
      position: relative;
      z-index: 2;
    }

    .segmented-btn[aria-selected="true"] {
      background: var(--bg-card);
      color: var(--text-main);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
    }

    /* Rasio Bar Tipis CASH vs QRIS */
    .ratio-bar-track {
      width: 100%;
      height: 6px;
      background: var(--bg-card-subtle);
      border-radius: var(--radius-pill);
      overflow: hidden;
      display: flex;
      margin: 0.65rem 0 0.85rem;
    }

    .ratio-bar-fill {
      height: 100%;
      transition: width var(--dur-slow) var(--ease-out);
    }
    .ratio-cash { background-color: var(--accent); }
    .ratio-qris { background-color: #5E5CE6; }

    /* Tombol Interaktif */
    .btn-action {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      min-height: 48px;
      padding: 0.75rem 1.35rem;
      border-radius: var(--radius-control);
      font-size: 1rem;
      font-weight: 600;
      text-align: center;
      transition: transform var(--dur-fast) var(--ease-out), opacity var(--dur-fast), background-color var(--dur-fast);
    }

    .btn-action:active:not(:disabled) {
      transform: scale(0.97);
    }

    .btn-action:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    .btn-brand {
      background: var(--accent);
      color: #FFFFFF;
      box-shadow: 0 4px 14px rgba(0, 102, 204, 0.25);
    }
    .btn-brand:hover:not(:disabled) { background: var(--accent-hover); }

    .btn-subtle {
      background: var(--bg-card-subtle);
      color: var(--text-main);
      border: 1px solid var(--border-thin);
    }

    .btn-danger {
      background: var(--negative-bg);
      color: var(--negative);
      border: 1px solid rgba(197, 34, 31, 0.2);
    }

    /* Grid Metrik Responsif */
    .grid-duo {
      display: grid;
      grid-template-columns: 1fr;
      gap: 1rem;
    }

    .grid-quad {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 0.75rem;
      margin-top: 0.75rem;
    }

    /* ==========================================================================
       6. GRAFIK SVG MANDIRI (BATANG & SPARKLINE)
       ========================================================================== */
    .chart-box {
      width: 100%;
      padding-top: 0.5rem;
    }

    .bar-chart-svg {
      width: 100%;
      height: 180px;
      display: block;
      overflow: visible;
    }

    .chart-bar-group {
      cursor: pointer;
      outline: none;
    }

    .chart-bar-rect {
      transform-origin: bottom;
      transition: height var(--dur-slow) var(--ease-out), y var(--dur-slow) var(--ease-out), opacity var(--dur-fast);
    }

    .chart-bar-group:hover .chart-bar-rect,
    .chart-bar-group:focus .chart-bar-rect {
      opacity: 0.8;
    }

    .sparkline-svg {
      width: 110px;
      height: 38px;
      display: block;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* ==========================================================================
       7. FORM TRANSAKSI DENGAN ROW SMOOTH TRANSITION
       ========================================================================== */
    .form-row-card {
      background: var(--bg-card);
      border: 1px solid var(--border-card);
      border-radius: var(--radius-card);
      padding: 1.15rem;
      margin-bottom: 0.85rem;
      box-shadow: var(--shadow-subtle);
      transition: opacity var(--dur-base) var(--ease-out), transform var(--dur-base) var(--ease-out);
    }

    .form-field-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 0.75rem;
      margin-top: 0.65rem;
    }

    .input-wrapper {
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
    }

    .field-label {
      font-size: 0.875rem;
      font-weight: 600;
      color: var(--text-sec);
    }

    .field-input {
      width: 100%;
      min-height: 48px;
      padding: 0.7rem 0.9rem;
      border-radius: var(--radius-control);
      border: 1.5px solid var(--border-thin);
      background: var(--bg-card-subtle);
      color: var(--text-main);
      font-size: 1rem;
      font-variant-numeric: tabular-nums;
      transition: border-color var(--dur-fast), background-color var(--dur-fast);
    }

    .field-input:focus {
      border-color: var(--accent);
      background: var(--bg-card);
      outline: none;
    }

    .field-input.has-error {
      border-color: var(--negative);
      background: var(--negative-bg);
    }

    .row-inline-error {
      color: var(--negative);
      font-size: 0.8125rem;
      font-weight: 500;
      margin-top: 0.25rem;
      display: flex;
      align-items: center;
      gap: 0.35rem;
    }

    /* Animasi Centang Sukses SVG (Stroke Draw) */
    .checkmark-circle {
      stroke-dasharray: 166;
      stroke-dashoffset: 166;
      stroke-width: 2.5;
      stroke: var(--positive);
      fill: none;
      animation: drawCircle 500ms var(--ease-out) forwards;
    }

    .checkmark-check {
      transform-origin: 50% 50%;
      stroke-dasharray: 48;
      stroke-dashoffset: 48;
      stroke-width: 2.5;
      stroke: var(--positive);
      animation: drawCheck 400ms 200ms var(--ease-out) forwards;
    }

    @keyframes drawCircle {
      100% { stroke-dashoffset: 0; }
    }
    @keyframes drawCheck {
      100% { stroke-dashoffset: 0; }
    }

    /* Spinner Animasi */
    .spinner-ring {
      width: 20px;
      height: 20px;
      border: 2.5px solid rgba(255, 255, 255, 0.3);
      border-top-color: currentColor;
      border-radius: 50%;
      animation: spinRing 700ms linear infinite;
      display: inline-block;
    }

    @keyframes spinRing {
      to { transform: rotate(360deg); }
    }

    /* Skeleton Loading Placeholder */
    .skeleton-box {
      background: linear-gradient(90deg, var(--bg-card-subtle) 25%, rgba(150,150,150,0.1) 50%, var(--bg-card-subtle) 75%);
      background-size: 200% 100%;
      animation: shimmer 1.5s infinite;
      border-radius: 8px;
    }

    @keyframes shimmer {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    /* Dialog / Bottom Sheet Modal */
    .apple-sheet {
      border: none;
      border-radius: 24px 24px 0 0;
      background: var(--bg-card);
      color: var(--text-main);
      box-shadow: var(--shadow-elevated);
      max-width: 600px;
      width: 100%;
      margin: auto auto 0 auto;
      padding: 1.5rem;
      transform: translateY(100%);
      transition: transform var(--dur-slow) var(--ease-sheet);
      outline: none;
    }

    .apple-sheet[open] {
      transform: translateY(0);
    }

    .apple-sheet::backdrop {
      background: rgba(0, 0, 0, 0.4);
      -webkit-backdrop-filter: blur(4px);
      backdrop-filter: blur(4px);
      opacity: 0;
      transition: opacity var(--dur-base) var(--ease-out);
    }

    .apple-sheet[open]::backdrop {
      opacity: 1;
    }

    .sheet-handle {
      width: 36px;
      height: 5px;
      background: var(--border-thin);
      border-radius: var(--radius-pill);
      margin: -0.5rem auto 1rem;
    }

    .toast-pill {
      position: fixed;
      top: 1.25rem;
      left: 50%;
      transform: translateX(-50%) translateY(-30px);
      background: var(--text-main);
      color: var(--bg-page);
      padding: 0.75rem 1.25rem;
      border-radius: var(--radius-pill);
      font-size: 0.9375rem;

      box-shadow: var(--shadow-elevated);
      z-index: 200;
      display: flex;
      align-items: center;
      gap: 0.6rem;
      opacity: 0;
      pointer-events: none;
      transition: all var(--dur-base) var(--ease-out);
    }

    .toast-pill.visible {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
      pointer-events: auto;
    }

      }

    const _memoryStore = {
      transactions: buildInitialDummyData()
    };

    const api = {
      /**
       * Mengambil seluruh baris transaksi dari sumber data (Google Sheets via n8n).
       * KONTRAK JSON YANG DIHARAPKAN (GET Response):
       * { "status": "ok", "data": [ { "rowNumber": 2, "date": "06/05/2026", "description": "INNOVA", "category": "CARWASH MEDIUM", "amount": 50000, "method": "CASH" } ] }
       */
      async getTransactions() {
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get('gagal') === '1') {
          throw new Error('Simulasi kegagalan koneksi API (?gagal=1 aktif)');
        }
        await new Promise(resolve => setTimeout(resolve, 450));
        return _memoryStore.transactions.map(item => ({ ...item }));
      },

      /**
       * Mengirim satu pengajuan transaksi harian (maksimal 30 baris) ke n8n.
       * KONTRAK JSON YANG DIHARAPKAN (POST Request Payload):
       * { "date": "25/10/2026", "dayName": "MINGGU", "legacyText": "...", "items": [ { "txNumber": 1, "description": "INNOVA", "category": "CARWASH MEDIUM", "amount": 50000, "method": "CASH" } ] }
       */
      async submitBatch(payload) {
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get('gagal') === '1') {
          throw new Error('Simulasi kegagalan simpan batch API (?gagal=1 aktif)');
        }
        await new Promise(resolve => setTimeout(resolve, 550));
        const maxRow = _memoryStore.transactions.reduce((max, r) => Math.max(max, r.rowNumber), 1);
        let nextRow = maxRow + 1;

        payload.items.forEach(item => {
          _memoryStore.transactions.push({
            rowNumber: nextRow++,
            date: payload.date,
            description: item.description.toUpperCase(),
            category: item.category,
            amount: Number(item.amount),
            method: item.method
          });
        });

        return {
          status: 'ok',
          insertedCount: payload.items.length,
          startRowNumber: maxRow + 1
        };
      }
    };

    const rupiahFormatter = new Intl.NumberFormat('id-ID');

    function formatRp(value) {
      const num = Number(value) || 0;
      if (num < 0) {
        return `-Rp ${rupiahFormatter.format(Math.abs(Math.round(num)))}`;
      }
      return `Rp ${rupiahFormatter.format(Math.round(num))}`;
    }

    function formatDotNumber(value) {
      const num = Number(value) || 0;
      return rupiahFormatter.format(Math.round(Math.abs(num)));
    }

    function parseDateDDMMYYYY(str) {
      if (typeof str !== 'string') return null;
      const trimmed = str.trim();
      const match = /^(\d{2})\/(\d{2})\/(\d{4})$/.exec(trimmed);
      if (!match) return null;

      const day = parseInt(match[1], 10);
      const month = parseInt(match[2], 10);
      const year = parseInt(match[3], 10);

      if (month < 1 || month > 12 || day < 1 || day > 31 || year < 2000 || year > 2100) {
        return null;
      }

      const d = new Date(year, month - 1, day);
      if (d.getFullYear() !== year || d.getMonth() !== month - 1 || d.getDate() !== day) {
        return null;
      }

      return {
        day,
        month,
        year,
        timestamp: d.getTime(),
        dayName: HARI_INDONESIA[d.getDay()],
        keyMMYYYY: `${String(month).padStart(2, '0')}/${year}`,
        shortYear: String(year).slice(-2),
        formatted: `${String(day).padStart(2, '0')}/${String(month).padStart(2, '0')}/${year}`
      };
    }

    function convertISOToDDMMYYYY(isoStr) {
      if (!isoStr || typeof isoStr !== 'string') return '';
      const parts = isoStr.split('-');
      if (parts.length !== 3) return '';
      return `${parts[2]}/${parts[1]}/${parts[0]}`;
    }

    function convertDDMMYYYYToISO(ddmmyyyy) {
      const parsed = parseDateDDMMYYYY(ddmmyyyy);
      if (!parsed) return '';
      return `${parsed.year}-${String(parsed.month).padStart(2, '0')}-${String(parsed.day).padStart(2, '0')}`;
    }

    function getTodayWIB() {
      try {
        const parts = new Intl.DateTimeFormat('en-GB', {
          timeZone: 'Asia/Jakarta',
          day: '2-digit',
          month: '2-digit',
          year: 'numeric'
        }).formatToParts(new Date());
        const d = parts.find(p => p.type === 'day').value;
        const m = parts.find(p => p.type === 'month').value;
        const y = parts.find(p => p.type === 'year').value;
        return `${d}/${m}/${y}`;
      } catch (e) {
        return '25/10/2026';
      }
    }

    function getCurrentWIBHour() {
      try {
        const hourStr = new Intl.DateTimeFormat('en-GB', {
          timeZone: 'Asia/Jakarta',
          hour: '2-digit',
          hour12: false
        }).format(new Date());
        return parseInt(hourStr, 10);
      } catch (e) {
        return 12;
      }
    }

    function inspectAllTransactions(rawRows) {
      const validDateRows = [];
      const issues = [];

      rawRows.forEach(row => {
        const parsedDate = parseDateDDMMYYYY(row.date);
        const rawAmt = row.amount;
        const isAmountValidNumber = typeof rawAmt === 'number' && !Number.isNaN(rawAmt) && rawAmt >= 0;

        if (!parsedDate) {
          issues.push({
            rowNumber: row.rowNumber,
            reason: `Tanggal tidak terbaca ("${row.date}")`,
            raw: row
          });
          return;
        }

        let safeAmount = 0;
        let hasAmountIssue = false;
        if (!isAmountValidNumber) {
          hasAmountIssue = true;
          safeAmount = 0;
          issues.push({
            rowNumber: row.rowNumber,
            reason: `Nominal tidak terbaca ("${rawAmt}"), dihitung Rp 0`,
            raw: row
          });
        } else {
          safeAmount = rawAmt;
        }

        validDateRows.push({
          ...row,
          parsedDate,
          safeAmount,
          hasAmountIssue
        });
      });

      return {
        validDateRows,
        issues
      };
    }

    function calculateMetrics(rows) {
      let uangMasukCash = 0;
      let uangMasukQris = 0;
      let uangKeluar = 0;
      let uangKeluarCash = 0;
      let uangKeluarQris = 0;
      let kasbonTotal = 0;
      let kasbonCount = 0;
      let kuponCount = 0;
      let belumDibayarCount = 0;
      let totalTransaksi = rows.length;

      const incomeByCategory = {};
      INCOME_CATEGORIES.forEach(cat => {
        incomeByCategory[cat] = {
          count: 0,
          uangMasuk: 0,
          cash: 0,
          qris: 0,
          kuponCount: 0,
          belumDibayarCount: 0
        };
      });

      const expenseByCategory = {};
      EXPENSE_CATEGORIES.forEach(cat => {
        expenseByCategory[cat] = {
          count: 0,
          total: 0,
          cash: 0,
          qris: 0,
          byDescription: {}
        };
      });

      const kasbonRows = [];

      rows.forEach(r => {
        const cat = r.category;
        const method = r.method;
        const amt = Number(r.safeAmount !== undefined ? r.safeAmount : r.amount) || 0;

        if (INCOME_CATEGORIES.includes(cat)) {
          const bucket = incomeByCategory[cat];
          bucket.count += 1;

          if (method === 'CASH') {
            uangMasukCash += amt;
            bucket.uangMasuk += amt;
            bucket.cash += amt;
          } else if (method === 'QRIS') {
            uangMasukQris += amt;
            bucket.uangMasuk += amt;
            bucket.qris += amt;
          } else if (method === 'KUPON') {
            kuponCount += 1;
            bucket.kuponCount += 1;
          } else if (method === 'BELUM DIBAYAR') {
            belumDibayarCount += 1;
            bucket.belumDibayarCount += 1;
          }
        } else if (EXPENSE_CATEGORIES.includes(cat)) {
          uangKeluar += amt;
          if (method === 'CASH') uangKeluarCash += amt;
          if (method === 'QRIS') uangKeluarQris += amt;

          const expBucket = expenseByCategory[cat];
          expBucket.count += 1;
          expBucket.total += amt;
          if (method === 'CASH') expBucket.cash += amt;
          if (method === 'QRIS') expBucket.qris += amt;

          const descKey = r.description || 'TANPA DESKRIPSI';
          if (!expBucket.byDescription[descKey]) {
            expBucket.byDescription[descKey] = { count: 0, total: 0 };
          }
          expBucket.byDescription[descKey].count += 1;
          expBucket.byDescription[descKey].total += amt;
        } else if (cat === KASBON_CATEGORY) {
          kasbonCount += 1;
          kasbonTotal += amt;
          kasbonRows.push(r);
        }
      });

      const uangMasuk = uangMasukCash + uangMasukQris;
      const selisihKasOperasional = uangMasuk - uangKeluar;

      return {
        uangMasuk,
        uangMasukCash,
        uangMasukQris,
        uangKeluar,
        uangKeluarCash,
        uangKeluarQris,
        selisihKasOperasional,
        totalTransaksi,
        kasbonTotal,
        kasbonCount,
        kasbonRows,
        kuponCount,
        belumDibayarCount,
        incomeByCategory,
        expenseByCategory
      };
    }

    function filterByMonth(validRows, monthKey) {
      return validRows.filter(r => r.parsedDate.keyMMYYYY === monthKey);
    }

    function filterByDateRange(validRows, startDDMMYYYY, endDDMMYYYY) {
      const startParsed = startDDMMYYYY ? parseDateDDMMYYYY(startDDMMYYYY) : null;
      const endParsed = endDDMMYYYY ? parseDateDDMMYYYY(endDDMMYYYY) : null;

      return validRows.filter(r => {
        const ts = r.parsedDate.timestamp;
        if (startParsed && ts < startParsed.timestamp) return false;
        if (endParsed && ts > endParsed.timestamp) return false;
        return true;
      });
    }

    function parseFlexibleRupiahInput(rawText) {
      if (typeof rawText === 'number') return rawText;
      if (!rawText || typeof rawText !== 'string') return NaN;
      const trimmed = rawText.trim();
      if (trimmed === '') return NaN;
      if (trimmed.includes('-')) return -1;

      const cleaned = trimmed.replace(/rp/gi, '').replace(/\./g, '').replace(/\s+/g, '');
      if (!/^\d+$/.test(cleaned)) return NaN;
      return parseInt(cleaned, 10);
    }

    function buildLegacyFormatPreview(dateDDMMYYYY, items) {
      const parsed = parseDateDDMMYYYY(dateDDMMYYYY) || parseDateDDMMYYYY(getTodayWIB());
      const header = `${parsed.dayName} ${String(parsed.day).padStart(2, '0')}/${String(parsed.month).padStart(2, '0')}/${parsed.shortYear}`;
      const lines = items.map((item, idx) => {
        const num = idx + 1;
        const desc = item.description.trim().toUpperCase();
        const amtDot = formatDotNumber(item.amount);
        return `${num}. ${desc}, ${item.category}, RP ${amtDot}, ${item.method}`;
      });
      return [header, ...lines].join('\n');
    }

    function validateCatatForm() {
      const errors = [];
      const parsedDate = parseDateDDMMYYYY(state.formDate);
      if (!parsedDate) {
        errors.push('Tanggal pengajuan tidak valid. Pilih tanggal yang benar, contoh: 25/10/2026.');
      }

      if (state.formRows.length === 0) {
        errors.push('Minimal harus ada 1 baris transaksi. Contoh: Deskripsi INNOVA, Kategori CARWASH MEDIUM, Nominal Rp 50.000, Metode CASH.');
      }

      if (state.formRows.length > 30) {
        errors.push(`Jumlah transaksi melebihi batas maksimal (saat ini ${state.formRows.length} baris). Maksimal 30 transaksi per pengajuan, contoh: kirim 30 baris terlebih dahulu.`);
      }

      const seenNumbers = new Set();

      state.formRows.forEach((row, idx) => {
        const rowNum = idx + 1;
        if (seenNumbers.has(rowNum)) {
          errors.push(`Baris #${rowNum}: Nomor transaksi duplikat. Gunakan nomor urut unik, contoh: 1, 2, 3.`);
        }
        seenNumbers.add(rowNum);

        const desc = (row.description || '').trim();
        if (!desc) {
          errors.push(`Baris #${rowNum}: Deskripsi masih kosong. Isi nama kendaraan atau keterangan, contoh: INNOVA REBORN atau BELI SHAMPOO.`);
        } else if (desc.includes(',')) {
          errors.push(`Baris #${rowNum}: Deskripsi tidak boleh memuat tanda koma (,) karena merusak pemisah data. Contoh yang benar: INNOVA HITAM B 1234 CD (tanpa koma).`);
        }

        const validMethods = VALID_METHODS_BY_CATEGORY[row.category] || [];
        if (!validMethods.includes(row.method)) {
          errors.push(`Baris #${rowNum}: Metode "${row.method}" tidak diizinkan untuk kategori "${row.category}". Contoh yang benar untuk ${row.category}: pilih ${validMethods.join(' atau ')}.`);
        }

        if (row.method === 'KUPON') {
          const parsedAmt = row.amountRaw === '' ? 0 : parseFlexibleRupiahInput(row.amountRaw);
          if (parsedAmt !== 0) {
            errors.push(`Baris #${rowNum}: Metode KUPON wajib bernilai Rp 0. Contoh yang benar: isi nominal 0.`);
          }
        } else {
          const rawStr = String(row.amountRaw ?? '').trim();
          if (rawStr === '') {
            errors.push(`Baris #${rowNum}: Nominal belum diisi. Masukkan angka nominal, contoh: 50000 atau RP 50.000.`);
          } else if (rawStr.includes('-')) {
            errors.push(`Baris #${rowNum}: Nominal tidak boleh bernilai negatif. Masukkan angka positif, contoh: Rp 50.000.`);
          } else {
            const parsedAmt = parseFlexibleRupiahInput(rawStr);
            if (Number.isNaN(parsedAmt) || parsedAmt < 0) {
              errors.push(`Baris #${rowNum}: Format nominal "${rawStr}" tidak terbaca. Masukkan angka saja atau tempelan yang benar, contoh: 50000 atau RP 50.000.`);
            }
          }
        }
      });

      return errors;
    }

    /* ==========================================================================
       ANIMASI COUNT-UP PERSIS NILAI AKHIR (600 - 800 ms)
       ========================================================================== */
    function runCountUpAnimations() {
      const isReduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      const elements = document.querySelectorAll('[data-count-value]');

      elements.forEach(el => {
        const target = Number(el.getAttribute('data-count-value')) || 0;
        const isRupiah = el.getAttribute('data-count-type') === 'rp';

        if (isReduced) {
          el.textContent = isRupiah ? formatRp(target) : target;
          return;
        }

        const duration = 650;
        const startTime = performance.now();

        function tick(now) {
          const elapsed = now - startTime;
          const progress = Math.min(1, elapsed / duration);
          const easeOut = 1 - Math.pow(1 - progress, 3);
          const current = Math.round(target * easeOut);

          el.textContent = isRupiah ? formatRp(current) : current;

          if (progress < 1) {
            requestAnimationFrame(tick);
          } else {
            el.textContent = isRupiah ? formatRp(target) : target;
          }
        }
        requestAnimationFrame(tick);
      });
    }

    /* ==========================================================================
       GRAFIK BATANG SVG MANDIRI & SPARKLINE 6 BULAN
       ========================================================================== */
    function generateSparklineSVG(values) {
      if (!values || values.length < 2) return '';
      const min = Math.min(...values);
      const max = Math.max(...values);
      const range = (max - min) || 1;
      const w = 110, h = 34, pad = 4;

      const points = values.map((v, i) => {
        const x = pad + (i / (values.length - 1)) * (w - pad * 2);
        const y = (h - pad) - ((v - min) / range) * (h - pad * 2);
        return `${x.toFixed(1)},${y.toFixed(1)}`;
      }).join(' ');

      return `
        <svg class="sparkline-svg" viewBox="0 0 ${w} ${h}" aria-hidden="true">
          <polyline points="${points}" fill="none" stroke="var(--accent)" stroke-width="2.5" />
        </svg>
      `;
    }

    function renderPillsMonthScroller(selectedKey) {
      return `
        <div class="month-pills-scroller no-print" role="tablist" aria-label="Pilih Periode Bulan">
          ${MONTHS_AVAILABLE.map(m => `
            <button
              type="button"
              class="month-pill-btn"
              role="tab"
              data-pick-month="${m.key}"
              aria-selected="${m.key === selectedKey}"
            >
              ${m.label}
            </button>
          `).join('')}
        </div>
      `;
    }

    function renderQualityWarning() {
      const issues = cachedInspection.issues;
      if (!issues || issues.length === 0) return '';

      const sample = issues.slice(0, 3).map(i => `Baris #${i.rowNumber} (${escapeHtml(i.reason)})`).join('; ');
      return `
        <div class="card" style="background:var(--warning-bg); border-color:var(--warning); margin-bottom:1.25rem;">
          <div class="card-label" style="color:var(--warning);">
            <svg class="icon icon-sm" aria-hidden="true"><use href="#icon-peringatan"/></svg>
            <strong>DATA PERLU DICEK DI SHEET</strong>
          </div>
          <p style="font-size:0.875rem; margin-top:0.35rem;">
            Ditemukan <strong>${issues.length} catatan bermasalah</strong> di spreadsheet. Contoh: ${sample}. Baris tanggal tidak valid tidak dihitung di bulan mana pun, dan baris nominal teks dihitung Rp 0.
          </p>
        </div>
      `;
    }

    function renderStandardSummaryHero(metrics) {
      const selisih = metrics.selisihKasOperasional;
      const isPositive = selisih > 0;
      const isZero = selisih === 0;

      const diffTagClass = isPositive ? 'tag-positive' : (isZero ? '' : 'tag-negative');
      const diffIcon = isPositive ? '#icon-panah-naik' : (isZero ? '#icon-info' : '#icon-panah-turun');
      const diffText = isPositive ? 'Positif' : (isZero ? 'Impas' : 'Negatif');

      const cashPercent = metrics.uangMasuk > 0 ? (metrics.uangMasukCash / metrics.uangMasuk) * 100 : 0;
      const qrisPercent = metrics.uangMasuk > 0 ? (metrics.uangMasukQris / metrics.uangMasuk) * 100 : 0;

      // Ambil nilai 6 bulan untuk sparkline
      const sparklineData = MONTHS_AVAILABLE.map(m => {
        const rows = filterByMonth(cachedInspection.validDateRows, m.key);
        return calculateMetrics(rows).selisihKasOperasional;
      });

      return `
        <!-- Kartu Paling Menonjol: Selisih Kas Operasional -->
        <div class="card card-hero card-hero-desktop">
          <div class="card-header-flex">
            <div class="card-label">
              <span class="icon-box-40 icon-box-diff" aria-hidden="true">
                <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><use href="#icon-bar-tiga"/></svg>
              </span>
              <span>Selisih Kas Operasional</span>
            </div>
            ${generateSparklineSVG(sparklineData)}
          </div>
          <div class="num-hero" data-count-value="${selisih}" data-count-type="rp" aria-label="${formatRp(selisih)}">
            ${formatRp(selisih)}
          </div>
          <div style="display:flex; align-items:center; gap:0.5rem; flex-wrap:wrap;">
            <span class="tag-chip ${diffTagClass}">
              <svg class="icon icon-sm" aria-hidden="true"><use href="${diffIcon}"/></svg>
              <span>${diffText}</span>
            </span>
            <span style="font-size:0.8125rem; color:var(--text-sec);">${metrics.totalTransaksi} total baris transaksi</span>
          </div>
          <div class="notice-non-laba">Selisih kas operasional bukan laba</div>
        </div>

        <div class="grid-duo">
          <!-- Uang Masuk -->
          <div class="card">
            <div class="card-header-flex">
              <div class="card-label">
                <span class="icon-box-40 icon-box-in" aria-hidden="true">
                  <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><use href="#icon-panah-naik"/></svg>
                </span>
                <span>Uang Masuk</span>
              </div>
            </div>
            <div class="num-large" data-count-value="${metrics.uangMasuk}" data-count-type="rp">
              ${formatRp(metrics.uangMasuk)}
            </div>

            <!-- Bar Rasio CASH vs QRIS -->
            <div class="ratio-bar-track" title="CASH ${cashPercent.toFixed(0)}% vs QRIS ${qrisPercent.toFixed(0)}%">
              <div class="ratio-bar-fill ratio-cash" style="width: ${cashPercent}%;"></div>
              <div class="ratio-bar-fill ratio-qris" style="width: ${qrisPercent}%;"></div>
            </div>

            <div style="display:flex; justify-content:space-between; font-size:0.875rem; color:var(--text-sec);">
              <span>CASH: <strong>${formatRp(metrics.uangMasukCash)}</strong></span>
              <span>QRIS: <strong>${formatRp(metrics.uangMasukQris)}</strong></span>
            </div>
          </div>

          <!-- Uang Keluar -->
          <div class="card">
            <div class="card-header-flex">
              <div class="card-label">
                <span class="icon-box-40 icon-box-out" aria-hidden="true">
                  <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><use href="#icon-panah-turun"/></svg>
                </span>
                <span>Uang Keluar</span>
              </div>
            </div>
            <div class="num-large" data-count-value="${metrics.uangKeluar}" data-count-type="rp">
              ${formatRp(metrics.uangKeluar)}
            </div>
            <div style="display:flex; justify-content:space-between; font-size:0.875rem; color:var(--text-sec); margin-top:1.45rem;">
              <span>CASH: <strong>${formatRp(metrics.uangKeluarCash)}</strong></span>
              <span>QRIS: <strong>${formatRp(metrics.uangKeluarQris)}</strong></span>
            </div>
          </div>
        </div>

        <!-- Indikator Pelengkap -->
        <div class="grid-quad">
          <div class="card" style="margin-bottom:0;">
            <div class="card-label" style="font-size:0.8125rem;">Jumlah Transaksi</div>
            <div class="num-medium" style="margin:0.25rem 0;">${metrics.totalTransaksi}</div>
            <p style="font-size:0.75rem; color:var(--text-sec);">Baris terdata</p>
          </div>

          <div class="card" style="margin-bottom:0;">
            <div class="card-label" style="font-size:0.8125rem;">
              <span class="icon-box-40 icon-box-kasbon" aria-hidden="true">
                <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><use href="#icon-dompet"/></svg>
              </span>
              <span>Kasbon</span>
            </div>
            <div class="num-medium" style="margin:0.25rem 0;">${formatRp(metrics.kasbonTotal)}</div>
            <p style="font-size:0.75rem; color:var(--text-sec);">${metrics.kasbonCount} baris (terpisah)</p>
          </div>

          <div class="card" style="margin-bottom:0;">
            <div class="card-label" style="font-size:0.8125rem;">Kupon</div>
            <div class="num-medium" style="margin:0.25rem 0;">${metrics.kuponCount}</div>
            <p style="font-size:0.75rem; color:var(--text-sec);">Nilai Rp 0</p>

          <div class="card" style="margin-bottom:0;">
            <div class="card-label" style="font-size:0.8125rem;">Belum Dibayar</div>
            <div class="num-medium" style="margin:0.25rem 0;">${metrics.belumDibayarCount}</div>
            <p style="font-size:0.75rem; color:var(--text-sec);">Uang masuk Rp 0</p>
          </div>
        </div>

    function renderTransactionListCards(rows, currentPage, actionPrefix) {
      const pageSize = 7;
      const totalPages = Math.max(1, Math.ceil(rows.length / pageSize));
      const safePage = Math.min(Math.max(1, currentPage), totalPages);
      const start = (safePage - 1) * pageSize;
      const slice = rows.slice(start, start + pageSize);

      if (rows.length === 0) {
        return `
          <div class="card" style="text-align:center; padding:2rem 1rem;">
            <svg class="empty-state-illustration" viewBox="0 0 24 24" aria-hidden="true"><use href="#ilustrasi-kosong"/></svg>
            <p style="font-weight:600;">Tidak ada transaksi pada filter ini (0 baris)</p>
            <p style="font-size:0.875rem; color:var(--text-sec); margin-top:0.25rem;">Silakan pilih bulan lain atau ubah kata kunci.</p>
          </div>
        `;
      }

      const cardsHtml = slice.map((r, i) => {
        const isKupon = r.method === 'KUPON';
        const displayAmt = isKupon ? 'Rp 0 (KUPON)' : formatRp(r.safeAmount);
        const delay = Math.min(i * 35, 280);

        return `
          <div class="card" style="margin-bottom:0.65rem; padding:1rem; cursor:pointer; animation:fadeSlideUp 250ms ${delay}ms var(--ease-out) both;" data-tx-detail="${r.rowNumber}">
            <div style="display:flex; justify-content:space-between; align-items:center; font-size:0.8125rem; color:var(--text-tertiary); margin-bottom:0.25rem;">
              <span>Baris #${r.rowNumber}</span>
              <span>${escapeHtml(r.parsedDate.formatted)}</span>
            </div>
            <div style="display:flex; justify-content:space-between; align-items:flex-start; gap:0.5rem;">
              <div>
                <strong style="font-size:1.05rem; letter-spacing:-0.01em;">${escapeHtml(r.description)}</strong>
                <div style="display:flex; gap:0.35rem; margin-top:0.35rem; flex-wrap:wrap;">
                  <span class="tag-chip" style="font-size:0.75rem;">${escapeHtml(r.category)}</span>
                  <span class="tag-chip" style="font-size:0.75rem;">${escapeHtml(r.method)}</span>
                  ${r.hasAmountIssue ? '<span class="tag-chip tag-negative" style="font-size:0.75rem;">Nominal rusak</span>' : ''}
                </div>
              </div>
              <div class="tx-amount" style="font-size:1.05rem; text-align:right;">${displayAmt}</div>
            </div>
          </div>
        `;
      }).join('');

      return `
        <div>
          ${cardsHtml}
          <div style="display:flex; justify-content:space-between; align-items:center; margin-top:1rem; flex-wrap:wrap; gap:0.5rem;" class="no-print">
            <button type="button" class="btn-action btn-subtle" data-page-action="${actionPrefix}-prev" ${safePage <= 1 ? 'disabled' : ''}>
              <svg class="icon icon-sm" aria-hidden="true"><use href="#icon-chevron-kiri"/></svg>
              <span>Sebelumnya</span>
            </button>
            <span style="font-size:0.875rem; color:var(--text-sec);">
              Halaman <strong>${safePage}</strong> dari <strong>${totalPages}</strong> (${rows.length} transaksi)
            </span>
            <button type="button" class="btn-action btn-subtle" data-page-action="${actionPrefix}-next" ${safePage >= totalPages ? 'disabled' : ''}>
              <span>Berikutnya</span>
              <svg class="icon icon-sm" aria-hidden="true"><use href="#icon-chevron-kanan"/></svg>
            </button>
          </div>
        </div>
      `;
    }

    /* ==========================================================================

                ${descItems || '<span style="font-size:0.8125rem; color:var(--text-sec);">Tidak ada rincian</span>'}
              </div>

            </div>
            <div class="tx-amount" style="font-size:1.05rem;">${formatRp(r.safeAmount)}</div>
          </div>

        subViewHtml = `
          <div class="card card-hero">
            <div class="card-label">Ringkasan Kasbon (${curMonthObj.label})</div>
            <div class="num-hero">${formatRp(metrics.kasbonTotal)}</div>
            <p style="font-size:0.875rem; color:var(--text-sec);">Total ${metrics.kasbonCount} baris kasbon</p>
            <p style="font-size:0.8125rem; color:var(--text-sec); margin-top:0.25rem;">Dicatat terpisah, tidak masuk uang masuk maupun uang keluar</p>
            <div class="notice-non-laba">Selisih kas operasional bukan laba</div>
          </div>
          <div class="card">
            ${kasbonItems || '<p style="color:var(--text-sec);">Tidak ada kasbon pada bulan ini.</p>'}

      } else if (state.rekapTab === 'semua') {

    function renderCatatScreen() {
      const parsedDate = parseDateDDMMYYYY(state.formDate) || parseDateDDMMYYYY(getTodayWIB());
      const dayName = parsedDate ? parsedDate.dayName : 'MINGGU';

      // Layar Konfirmasi Sebelum Kirim
      if (state.formStep === 'confirm') {
        const normalized = state.formRows.map((r, idx) => {
          const amt = r.method === 'KUPON' ? 0 : parseFlexibleRupiahInput(r.amountRaw);
          return {
            txNumber: idx + 1,
            description: r.description.trim().toUpperCase(),
            category: r.category,
            amount: amt,
            safeAmount: amt,
            method: r.method
          };
        });

        const confirmMetrics = calculateMetrics(normalized);
        const legacyPreview = buildLegacyFormatPreview(state.formDate, normalized);

        const itemsSummary = normalized.map(item => `
          <div style="display:flex; justify-content:space-between; padding:0.5rem 0; border-bottom:1px solid var(--border-thin);">
            <div>
              <strong>${item.txNumber}. ${escapeHtml(item.description)}</strong>
              <div style="font-size:0.8125rem; color:var(--text-sec);">${item.category} • ${item.method}</div>
            </div>
            <div class="tx-amount">${formatRp(item.amount)}</div>
          </div>
        `).join('');

        return `

            <div style="margin-bottom:1rem;">
              <h1 class="section-title-with-icon" style="font-size:1.65rem; font-weight:700;">
                <span class="icon-circle-32-catat" aria-hidden="true">
                  <svg class="icon icon-sm" viewBox="0 0 24 24" aria-hidden="true"><use href="#icon-catat"/></svg>
                </span>
                <span>Konfirmasi Pengajuan</span>

              <p style="font-size:0.9375rem; color:var(--text-sec);">${dayName}, ${state.formDate} (${normalized.length} transaksi)</p>

            ${renderStandardSummaryHero(confirmMetrics)}

              </button>
            </div>
          </div>
        `;
      }

      // Layar Input Baris Transaksi
      const rowsHtml = state.formRows.map((row, idx) => {
        const num = idx + 1;
        const validMethods = VALID_METHODS_BY_CATEGORY[row.category] || ['CASH'];
        const isKupon = row.method === 'KUPON';

        // Deteksi error khusus baris ini
        const rowErrPrefix = `Baris #${num}:`;
        const rowErrors = state.formErrors.filter(e => e.startsWith(rowErrPrefix));

        return `
          <div class="form-row-card" data-row-id="${row.id}">
            <div style="display:flex; justify-content:space-between; align-items:center;">
              <strong style="font-size:0.9375rem;">Transaksi #${num}</strong>

      return `

    function renderCariScreen() {
      const allValid = cachedInspection.validDateRows;
      let results = allValid;

      if (state.searchStart || state.searchEnd) {
        results = filterByDateRange(results, state.searchStart, state.searchEnd);
      }

      const kw = state.searchKeyword.trim().toUpperCase();
      if (kw.length > 0 && !state.searchError) {
        results = results.filter(r => {
          return (
            r.parsedDate.formatted.toUpperCase().includes(kw) ||
            String(r.description).toUpperCase().includes(kw) ||
            String(r.category).toUpperCase().includes(kw) ||
            String(r.method).toUpperCase().includes(kw)
          );
        });
      } else if (state.searchError) {
        results = [];
      }

      const fullMetrics = calculateMetrics(results);

      return `
        <div>
          <div style="margin-bottom:1rem;">
            <h1 style="font-size:1.65rem; font-weight:700;">Cari Transaksi</h1>
            <p style="font-size:0.9375rem; color:var(--text-sec);">Cari deskripsi, kategori, metode, atau tanggal</p>
          </div>

          <div class="card no-print">
            <form id="search-action-form" novalidate>
              <div class="input-wrapper">
                <label class="field-label" for="search-input-field">Kata Kunci (Maks 32 karakter)</label>
                <input
                  type="text"
                  id="search-input-field"
                  class="field-input"
                  placeholder="Contoh: INNOVA, QRIS, TOKEN LISTRIK"
                  value="${escapeHtml(state.searchKeyword)}"
                />
              </div>

              <div style="display:grid; grid-template-columns:1fr 1fr; gap:0.75rem; margin-top:0.75rem;">
                <div class="input-wrapper">
                  <label class="field-label" for="search-start-picker">Dari Tanggal (Opsional)</label>
                  <input type="date" id="search-start-picker" class="field-input" value="${convertDDMMYYYYToISO(state.searchStart)}" />
                </div>
                <div class="input-wrapper">
                  <label class="field-label" for="search-end-picker">Sampai Tanggal (Opsional)</label>
                  <input type="date" id="search-end-picker" class="field-input" value="${convertDDMMYYYYToISO(state.searchEnd)}" />
                </div>
              </div>

              <div style="display:flex; gap:0.5rem; justify-content:flex-end; margin-top:0.75rem;">
                <button type="button" id="btn-reset-search" class="btn-action btn-subtle">Reset</button>
                <button type="submit" class="btn-action btn-brand">Terapkan</button>
              </div>
            </form>
          </div>

          ${state.searchError ? `
            <div class="card" style="background:var(--negative-bg); border-color:var(--negative);">
              <p style="color:var(--negative); font-size:0.875rem;">${escapeHtml(state.searchError)}</p>
            </div>
          ` : ''}

          <div style="margin-top:1.25rem;">
            <h2 style="font-size:1.15rem; font-weight:700; margin-bottom:0.75rem;">Hasil Pencarian (${results.length} baris)</h2>
            ${renderTransactionListCards(results, state.searchPage, 'cari')}
          </div>

          ${results.length > 0 ? `
            <div style="margin-top:2rem;">
              <h2 style="font-size:1.15rem; font-weight:700; margin-bottom:0.75rem;">Ringkasan Hasil Temuan</h2>
              ${renderStandardSummaryHero(fullMetrics)}
            </div>
          ` : ''}
        </div>
      `;
    }

    function renderDeveloperScreen() {

      let isWithinHours = actualHour >= 6 && actualHour < 21;
      if (state.devSimulateHourMode === 'inside') isWithinHours = true;
      if (state.devSimulateHourMode === 'outside') isWithinHours = false;

      return `
        <div>
          <div style="margin-bottom:1rem;">
            <h1 style="font-size:1.65rem; font-weight:700;">Hubungi Developer</h1>
            <p style="font-size:0.9375rem; color:var(--text-sec);">Jam layanan: 06.00 - 21.00 WIB</p>
          </div>

          ${state.devError ? `
            <div class="card" style="background:var(--negative-bg); border-color:var(--negative);">
              <p style="color:var(--negative); font-size:0.875rem;">${escapeHtml(state.devError)}</p>
            </div>
          ` : ''}

          ${state.devReply ? `
            <div class="card" style="background:var(--positive-bg); border-color:var(--positive);">
              <div class="card-label" style="color:var(--positive);">Status Respon Pengiriman</div>
              <p style="font-size:1.05rem; font-weight:600; margin-top:0.25rem;">"${escapeHtml(state.devReply)}"</p>

              <div class="card" style="background:var(--bg-card-subtle); padding:0.75rem; margin-top:0.85rem;">
                <label class="field-label" for="dev-hour-override">Simulasi Jam Kerja Demo (${isWithinHours ? 'Dalam Jam Layanan' : 'Luar Jam Layanan'})</label>
                <select id="dev-hour-override" class="field-input" style="margin-top:0.25rem;">

                  <option value="inside" ${state.devSimulateHourMode === 'inside' ? 'selected' : ''}>Simulasi Siang (06.00 - 21.00 WIB)</option>

              <button type="submit" class="btn-action btn-brand" style="width:100%; margin-top:0.85rem;">Kirim Pesan Bantuan</button>

      `;
    }

    /* ==========================================================================
       RENDERER VIEW UTAMA (VIEW TRANSITIONS API SUPPORT)
       ========================================================================== */
    function renderAppView(shouldAnimate = false) {
      const root = document.getElementById('app-content-root');
      if (!root) return;

      const updateContent = () => {
        // Tampilkan State Error / Loading jika aktif
        if (state.isLoading) {
          root.innerHTML = `
            <div style="padding:2rem 0;">
              <div class="skeleton-box" style="height:32px; width:220px; margin-bottom:1rem;"></div>
              <div class="skeleton-box" style="height:180px; width:100%; margin-bottom:1rem;"></div>
              <div class="grid-duo">
                <div class="skeleton-box" style="height:120px;"></div>
                <div class="skeleton-box" style="height:120px;"></div>
              </div>
            </div>
          `;
          return;
        }

        if (state.apiError) {
          root.innerHTML = `
            <div class="card" style="background:var(--negative-bg); border-color:var(--negative); text-align:center; padding:2rem 1.5rem;">
              <svg class="icon icon-lg" style="color:var(--negative); margin-bottom:0.5rem;" aria-hidden="true"><use href="#icon-peringatan"/></svg>
              <h2 style="font-size:1.25rem; font-weight:700; color:var(--negative);">Terjadi Kendala Koneksi</h2>
              <p style="font-size:0.9375rem; margin:0.5rem 0 1rem;">${escapeHtml(state.apiError)}</p>
              <button type="button" class="btn-action btn-brand" onclick="loadData()">
                <svg class="icon icon-sm" aria-hidden="true"><use href="#icon-muat-ulang"/></svg>
                <span>Coba lagi</span>
              </button>
            </div>
          `;
          return;
        }

        switch (state.screen) {
          case 'beranda': root.innerHTML = renderBerandaScreen(); break;
          case 'rekap': root.innerHTML = renderRekapScreen(); break;
          case 'catat': root.innerHTML = renderCatatScreen(); break;
          case 'cari': root.innerHTML = renderCariScreen(); break;
          case 'developer': root.innerHTML = renderDeveloperScreen(); break;
          default: root.innerHTML = renderBerandaScreen(); break;
        }

        // Update indikator aktif navigasi
        document.querySelectorAll('.nav-tab-btn').forEach(btn => {
          if (btn.getAttribute('data-nav') === state.screen) {
            btn.setAttribute('aria-current', 'page');
          } else {
            btn.removeAttribute('aria-current');
          }
        });

        if (shouldAnimate) {
          runCountUpAnimations();
        }
      };

      if (document.startViewTransition && !window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
        document.startViewTransition(() => updateContent());
      } else {
        updateContent();
      }
    }

    /* ==========================================================================
       BOTTOM SHEET LAINNYA & DETAIL TRANSAKSI
       ========================================================================== */
    const sheetDialog = document.getElementById('sheet-dialog');
    const sheetTitle = document.getElementById('sheet-title');
    const sheetBody = document.getElementById('sheet-body-content');

    function openSheetWithContent(title, htmlContent) {
      if (!sheetDialog) return;
      sheetTitle.textContent = title;
      sheetBody.innerHTML = htmlContent;
      sheetDialog.showModal();
    }

    function closeSheet() {
      if (sheetDialog && sheetDialog.open) {
        sheetDialog.close();
      }
    }

    function showMoreMenuSheet() {
      const menuHtml = `
        <div style="display:flex; flex-direction:column; gap:0.5rem;">
          <button type="button" class="btn-action btn-subtle" style="justify-content:flex-start;" data-nav="developer">
            <svg class="icon icon-sm" aria-hidden="true"><use href="#icon-developer"/></svg>
            <span>Hubungi Developer</span>
          </button>
          <div style="border-top:1px solid var(--border-thin); margin:0.4rem 0;"></div>
          <div style="font-size:0.8125rem; color:var(--text-sec); padding:0 0.5rem;">
            Dashboard Keuangan Carwash v2.0 • Standar Apple Motion
          </div>
        </div>
      `;
      openSheetWithContent('Menu Tambahan', menuHtml);
    }

    function showTxDetailSheet(rowNumber) {
      const row = cachedInspection.validDateRows.find(r => r.rowNumber === rowNumber);
      if (!row) return;

      const detailHtml = `
        <div style="display:flex; flex-direction:column; gap:0.75rem;">
          <div style="font-size:1.35rem; font-weight:700;">${escapeHtml(row.description)}</div>
          <div style="display:flex; gap:0.4rem;">
            <span class="tag-chip">${escapeHtml(row.category)}</span>
            <span class="tag-chip">${escapeHtml(row.method)}</span>
          </div>
          <div style="font-size:1.75rem; font-weight:700; color:var(--accent); margin:0.35rem 0;" class="tx-amount">
            ${row.method === 'KUPON' ? 'Rp 0 (KUPON)' : formatRp(row.safeAmount)}
          </div>
          <div style="font-size:0.875rem; color:var(--text-sec); border-top:1px solid var(--border-thin); padding-top:0.75rem;">
            <div>Tanggal Transaksi: <strong>${row.parsedDate.formatted} (${row.parsedDate.dayName})</strong></div>
            <div>Baris Sumber Sheet: <strong>#${row.rowNumber}</strong></div>

    /* ==========================================================================
       EVENT LISTENERS TERPUSAT (CLICK, INPUT, CHANGE, SUBMIT)
       ========================================================================== */
    function attachEventListeners() {
      // Klik Navigasi & Action
      document.addEventListener('click', async (e) => {
        const navBtn = e.target.closest('[data-nav]');
        if (navBtn) {
          state.screen = navBtn.getAttribute('data-nav');
          closeSheet();
          renderAppView(true);
          window.scrollTo({ top: 0, behavior: 'smooth' });
          return;
        }

        const gotoBtn = e.target.closest('[data-goto]');
        if (gotoBtn) {
          state.screen = gotoBtn.getAttribute('data-goto');
          renderAppView(true);
          window.scrollTo({ top: 0, behavior: 'smooth' });
          return;
        }

        if (e.target.closest('#btn-open-more')) {
          showMoreMenuSheet();
          return;
        }

        if (e.target.closest('#btn-close-sheet')) {
          closeSheet();
          return;
        }

        if (e.target.closest('#btn-force-reload')) {
          await loadData();
          showToast('Data berhasil dimuat ulang');
          return;
        }

        // Pemilih Bulan Pill
        const pillBtn = e.target.closest('[data-pick-month]');
        if (pillBtn) {
          state.selectedMonth = pillBtn.getAttribute('data-pick-month');
          state.rekapPage = 1;
          renderAppView(true);
          return;
        }

        // Ketuk Batang Grafik untuk memilih bulan
        const barGroup = e.target.closest('[data-select-month]');
        if (barGroup) {
          state.selectedMonth = barGroup.getAttribute('data-select-month');
          state.rekapPage = 1;
          renderAppView(true);
          return;
        }

        // Sub Tab Rekap
        const rkTab = e.target.closest('[data-rekap-tab]');
        if (rkTab) {
          state.rekapTab = rkTab.getAttribute('data-rekap-tab');
          state.rekapPage = 1;
          renderAppView(false);
          return;
        }

        // Paginasi
        const pgBtn = e.target.closest('[data-page-action]');
        if (pgBtn) {
          const act = pgBtn.getAttribute('data-page-action');
          if (act === 'rekap-prev') state.rekapPage = Math.max(1, state.rekapPage - 1);
          if (act === 'rekap-next') state.rekapPage += 1;
          if (act === 'cari-prev') state.searchPage = Math.max(1, state.searchPage - 1);
          if (act === 'cari-next') state.searchPage += 1;
          renderAppView(false);
          return;
        }

        // Buka Detail Transaksi
        const txCard = e.target.closest('[data-tx-detail]');
        if (txCard) {
          const rowNum = Number(txCard.getAttribute('data-tx-detail'));
          showTxDetailSheet(rowNum);
          return;
        }

        // Form Catat: Tambah Baris
        if (e.target.closest('#btn-add-form-row')) {
          if (state.formRows.length < 30) {
            state.formRows.push({
              id: state.formNextId++,
              description: '',
              category: 'CARWASH MEDIUM',
              amountRaw: '',
              amountFormatted: '',
              method: 'CASH'
            });
            renderAppView(false);
          }
          return;
        }

        // Form Catat: Hapus Baris
        const remBtn = e.target.closest('[data-remove-row]');
        if (remBtn) {
          const id = Number(remBtn.getAttribute('data-remove-row'));
          if (state.formRows.length > 1) {
            state.formRows = state.formRows.filter(r => r.id !== id);
            renderAppView(false);
          }
          return;
        }

        // Form Catat: Reset Form
        if (e.target.closest('#btn-reset-form-all') || e.target.closest('#btn-confirm-batal')) {
          state.formRows = [{ id: state.formNextId++, description: '', category: 'CARWASH MEDIUM', amountRaw: '', amountFormatted: '', method: 'CASH' }];
          state.formErrors = [];
          state.formStep = 'input';
          renderAppView(false);
          return;
        }

        // Form Catat: Periksa Form
        if (e.target.closest('#btn-verify-form')) {
          state.formErrors = validateCatatForm();
          if (state.formErrors.length === 0) {
            state.formStep = 'confirm';
          }
          renderAppView(false);
          window.scrollTo({ top: 0, behavior: 'smooth' });
          return;
        }

        // Form Catat: Ubah
        if (e.target.closest('#btn-confirm-ubah')) {
          state.formStep = 'input';
          renderAppView(false);
          return;
        }

        // Form Catat: Simpan (Anti Dobel Kirim & Try/Catch)
        if (e.target.closest('#btn-confirm-simpan')) {
          if (state.formSubmitting) return;
          state.formSubmitting = true;
          renderAppView(false);

          const items = state.formRows.map((r, idx) => ({
            txNumber: idx + 1,
            description: r.description.trim().toUpperCase(),
            category: r.category,
            amount: r.method === 'KUPON' ? 0 : parseFlexibleRupiahInput(r.amountRaw),
            method: r.method
          }));

          const parsed = parseDateDDMMYYYY(state.formDate) || parseDateDDMMYYYY(getTodayWIB());
          const payload = {
            date: parsed.formatted,
            dayName: parsed.dayName,
            legacyText: buildLegacyFormatPreview(parsed.formatted, items),
            items
          };

          try {
            await api.submitBatch(payload);
            try {
              await loadData();
            } catch (refreshErr) {
              showToast('Tersimpan, tetapi laporan belum diperbarui. Tekan Muat ulang.');
            }

            if (MONTHS_AVAILABLE.some(m => m.key === parsed.keyMMYYYY)) {
              state.selectedMonth = parsed.keyMMYYYY;
            }

            state.formRows = [{ id: state.formNextId++, description: '', category: 'CARWASH MEDIUM', amountRaw: '', amountFormatted: '', method: 'CASH' }];
            state.formStep = 'input';
            state.formErrors = [];
            showToast(`Berhasil menyimpan ${items.length} transaksi`);
          } catch (submitErr) {
            alert(`Gagal menyimpan transaksi (${submitErr.message}). Jangan menekan tombol berulang kali. Silakan hubungi developer.`);
          } finally {
            state.formSubmitting = false;
            renderAppView(true);
          }
          return;
        }

        // Reset Cari
        if (e.target.closest('#btn-reset-search')) {
          state.searchKeyword = '';
          state.searchStart = '';
          state.searchEnd = '';
          state.searchError = '';
          state.searchPage = 1;
          renderAppView(false);
          return;
        }
      });

      // Perubahan Pilihan Form & Input
      document.addEventListener('change', (e) => {
        const t = e.target;

        if (t.id === 'form-date-input') {
          const c = convertISOToDDMMYYYY(t.value);
          if (c) {
            state.formDate = c;
            renderAppView(false);
          }
          return;
        }

        if (t.classList.contains('input-row-cat')) {
          const id = Number(t.getAttribute('data-row-id'));
          const row = state.formRows.find(r => r.id === id);
          if (row) {
            row.category = t.value;
            const allowed = VALID_METHODS_BY_CATEGORY[row.category] || ['CASH'];
            if (!allowed.includes(row.method)) {
              row.method = allowed[0];
            }
            if (row.method === 'KUPON') {
              row.amountRaw = '0';
              row.amountFormatted = 'Rp 0';
            }
            renderAppView(false);
          }
          return;
        }

        if (t.classList.contains('input-row-method')) {
          const id = Number(t.getAttribute('data-row-id'));
          const row = state.formRows.find(r => r.id === id);
          if (row) {
            row.method = t.value;
            if (row.method === 'KUPON') {
              row.amountRaw = '0';
              row.amountFormatted = 'Rp 0';
            }
            renderAppView(false);
          }
          return;
        }

        if (t.id === 'dev-urgency-select') {
          state.devUrgency = t.value;
          return;
        }

        if (t.id === 'dev-hour-override') {
          state.devSimulateHourMode = t.value;
          renderAppView(false);
          return;
        }
      });

      // Sinkronisasi Ketikan Input
      document.addEventListener('input', (e) => {
        const t = e.target;

        if (t.classList.contains('input-row-desc')) {
          const id = Number(t.getAttribute('data-row-id'));
          const row = state.formRows.find(r => r.id === id);
          if (row) row.description = t.value;
          return;
        }

        if (t.classList.contains('input-row-amt')) {
          const id = Number(t.getAttribute('data-row-id'));
          const row = state.formRows.find(r => r.id === id);
          if (row && row.method !== 'KUPON') {
            row.amountRaw = t.value;
            row.amountFormatted = '';
          }
          return;
        }

        if (t.id === 'dev-msg-text') {
          state.devMessage = t.value;
          return;
        }
      });

      // Format Rp Saat Selesai Input
      document.addEventListener('focusout', (e) => {
        const t = e.target;
        if (t.classList.contains('input-row-amt')) {
          const id = Number(t.getAttribute('data-row-id'));
          const row = state.formRows.find(r => r.id === id);
          if (row && row.method !== 'KUPON') {
            const p = parseFlexibleRupiahInput(row.amountRaw);
            if (!Number.isNaN(p) && p >= 0) {
              row.amountRaw = String(p);
              row.amountFormatted = formatRp(p);
              t.value = row.amountFormatted;
            }
          }
        }
      });

      // Form Submit (Cari & Hubungi Developer)
      document.addEventListener('submit', (e) => {
        if (e.target.id === 'search-action-form') {
          e.preventDefault();
          const kwEl = document.getElementById('search-input-field');
          const sEl = document.getElementById('search-start-picker');
          const eEl = document.getElementById('search-end-picker');

          state.searchKeyword = kwEl ? kwEl.value : '';
          state.searchStart = sEl && sEl.value ? convertISOToDDMMYYYY(sEl.value) : '';
          state.searchEnd = eEl && eEl.value ? convertISOToDDMMYYYY(eEl.value) : '';
          state.searchPage = 1;

          if (state.searchKeyword.length > 32) {
            state.searchError = `Kata kunci terlalu panjang (${state.searchKeyword.length} karakter). Maksimal 32 karakter.`;
          } else if (state.searchStart && state.searchEnd) {
            const sp = parseDateDDMMYYYY(state.searchStart);
            const ep = parseDateDDMMYYYY(state.searchEnd);
            if (sp && ep && sp.timestamp > ep.timestamp) {
              state.searchError = 'Tanggal awal tidak boleh melebihi tanggal akhir pencarian.';
            } else {
              state.searchError = '';
            }
          } else {
            state.searchError = '';
          }

          renderAppView(false);
          return;
        }

        if (e.target.id === 'form-dev-support') {
          e.preventDefault();
          const msg = (state.devMessage || '').trim();
          if (!msg) {
            state.devError = 'Pesan kendala tidak boleh kosong. Mohon jelaskan masalah yang dihadapi.';
            state.devReply = '';
            renderAppView(false);
            return;
          }

          state.devError = '';
          const actualHour = getCurrentWIBHour();
          let inHours = actualHour >= 6 && actualHour < 21;
          if (state.devSimulateHourMode === 'inside') inHours = true;
          if (state.devSimulateHourMode === 'outside') inHours = false;

          if (inHours) {
            state.devReply = 'Developer akan segera mengecek atau menghubungi Anda';
          } else if (state.devUrgency === 'Biasa') {
            state.devReply = 'Pesan akan dibalas keesokan harinya';
          } else {
            state.devReply = 'Akan ditindaklanjuti secepatnya';
          }

          state.devMessage = '';
          renderAppView(false);
          showToast('Pesan terkirim ke developer');
          return;
        }
      });
    }

    // Inisialisasi saat berkas dimuat
    window.addEventListener('DOMContentLoaded', async () => {
      attachEventListeners();
      await loadData();
    });
  </script>
</body>
</html>
